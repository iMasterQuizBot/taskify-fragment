name: routine_app
description: Taskify - Daily routine & habit organizer
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0
  share_plus: ^10.0.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
