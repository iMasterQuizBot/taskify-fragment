name: Build Taskify APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_ORG: com.taskify
  APP_PKG: com.taskify.routine_app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android & Inject Setup
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org "$APP_ORG" --project-name routine_app .
          fi

          PKG_PATH=$(echo "$APP_PKG" | tr '.' '/')
          mkdir -p "android/app/src/main/kotlin/$PKG_PATH"
          sed "s/__PKG__/$APP_PKG/g" ci/MainActivity.kt.template > "android/app/src/main/kotlin/$PKG_PATH/MainActivity.kt"

      - name: Force compileSdk 36 for all plugins
        run: |
          if [ -f "android/build.gradle.kts" ]; then
            cat ci/root_compile_sdk.kts.txt >> android/build.gradle.kts
          fi

      - name: Enable Core Library Desugaring (for flutter_local_notifications)
        run: |
          python3 - << 'PYEOF'
          path = "android/app/build.gradle.kts"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if "isCoreLibraryDesugaringEnabled" not in content:
              content = content.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )

          if "desugar_jdk_libs" not in content:
              content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Core library desugaring enabled successfully!")
          PYEOF

      - name: Notification receivers & custom sound files
        run: |
          mkdir -p android/app/src/main/res/raw
          if [ -d "assets/sounds" ]; then
            for f in assets/sounds/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f" | tr '[:upper:]' '[:lower:]' | tr '-' '_')
              cp "$f" "android/app/src/main/res/raw/$base"
            done
          fi

          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/taskify_sound_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <files-path name="taskify_files" path="." />
              <cache-path name="taskify_cache" path="." />
              <external-files-path name="taskify_ext" path="." />
          </paths>
          EOF

      - name: Patch & Validate AndroidManifest.xml (Safe XML)
        run: |
          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise RuntimeError("<application> tag missing in AndroidManifest.xml")

          def attr(name):
              return f"{{{ANDROID_NS}}}{name}"

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
          ]
          existing_perms = {
              el.get(attr("name")) for el in root.findall("uses-permission")
          }
          for p in permissions:
              if p not in existing_perms:
                  el = ET.Element("uses-permission")
                  el.set(attr("name"), p)
                  root.insert(0, el)

          provider_auth = "${applicationId}.taskifysounds"
          has_provider = any(
              p.get(attr("authorities")) == provider_auth
              for p in app.findall("provider")
          )
          if not has_provider:
              prov = ET.SubElement(app, "provider")
              prov.set(attr("name"), "androidx.core.content.FileProvider")
              prov.set(attr("authorities"), provider_auth)
              prov.set(attr("exported"), "false")
              prov.set(attr("grantUriPermissions"), "true")
              meta = ET.SubElement(prov, "meta-data")
              meta.set(attr("name"), "android.support.FILE_PROVIDER_PATHS")
              meta.set(attr("resource"), "@xml/taskify_sound_paths")

          receivers = [
              ("com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver", "false", None),
              ("com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver", "false", [
                  "android.intent.action.BOOT_COMPLETED",
                  "android.intent.action.MY_PACKAGE_REPLACED",
                  "android.intent.action.QUICKBOOT_POWERON",
                  "com.htc.intent.action.QUICKBOOT_POWERON",
              ]),
          ]
          existing_recv = {r.get(attr("name")) for r in app.findall("receiver")}
          for r_name, r_exp, actions in receivers:
              if r_name not in existing_recv:
                  rec = ET.SubElement(app, "receiver")
                  rec.set(attr("name"), r_name)
                  rec.set(attr("exported"), r_exp)
                  if actions:
                      inf = ET.SubElement(rec, "intent-filter")
                      for act in actions:
                          a = ET.SubElement(inf, "action")
                          a.set(attr("name"), act)

          ET.indent(tree, space="    ")
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          ET.parse(manifest_path)
          print("AndroidManifest.xml validated successfully!")
          PYEOF

      - name: Install Dependencies & Clean
        run: |
          flutter clean
          flutter pub get

      - name: Setup Icons
        run: |
          if [ -f "app_icon.png" ]; then
            dart run flutter_launcher_icons
          fi

      - name: Build Android APK
        run: flutter build apk --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taskify-apks
          path: build/app/outputs/flutter-apk/*.apk
