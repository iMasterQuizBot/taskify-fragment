name: Build Taskify APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_ORG: com.taskify
  APP_PKG: com.taskify.routine_app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android & Inject Setup
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org "$APP_ORG" --project-name routine_app .
          fi

          PKG_PATH=$(echo "$APP_PKG" | tr '.' '/')
          mkdir -p "android/app/src/main/kotlin/$PKG_PATH"
          sed "s/__PKG__/$APP_PKG/g" ci/MainActivity.kt.template > "android/app/src/main/kotlin/$PKG_PATH/MainActivity.kt"
          sed "s/__PKG__/$APP_PKG/g" ci/TaskifyAllWidgets.kt.template > "android/app/src/main/kotlin/$PKG_PATH/TaskifyAllWidgets.kt"

      - name: Force compileSdk 36 for all plugins
        run: |
          if [ -f "android/build.gradle.kts" ]; then
            cat ci/root_compile_sdk.kts.txt >> android/build.gradle.kts
          fi

      - name: Configure Gradle (Desugaring & Disable Failing Release Lint)
        run: |
          python3 - << 'PYEOF'
          path = "android/app/build.gradle.kts"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if "checkReleaseBuilds" not in content:
              content = content.replace(
                  "compileOptions {",
                  "lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n\n    compileOptions {",
                  1,
              )

          if "isCoreLibraryDesugaringEnabled" not in content:
              content = content.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )

          if "desugar_jdk_libs" not in content:
              content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Gradle configured successfully!")
          PYEOF

      - name: Patch & Validate AndroidManifest.xml (Safe XML)
        run: |
          python3 - << 'PYEOF'
          import os
          import xml.etree.ElementTree as ET

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise RuntimeError("<application> tag missing in AndroidManifest.xml")

          def attr(name):
              return f"{{{ANDROID_NS}}}{name}"

          # FIX: "flutter create" डिफ़ॉल्ट रूप से project-name (routine_app) को ही
          # app का display label बना देता है, इसलिए हर नए build में ऐप का नाम
          # बदला हुआ दिखता था। अब हमेशा "Taskify" ही label रहेगा।
          app.set(attr("label"), "Taskifyy")

          for act in app.findall("activity"):
              if "MainActivity" in (act.get(attr("name")) or ""):
                  act.set(attr("windowSoftInputMode"), "adjustResize")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
              # FIX: इनके बिना DeepSeek Web (WebView) के अंदर "फ़ोटो/फ़ाइल अपलोड" बटन
              # दबाने पर सिस्टम का file-chooser/कैमरा खुलता ही नहीं (चुपचाप कैंसल हो
              # जाता है), इसलिए अपलोड कभी काम नहीं करता था।
              "android.permission.CAMERA",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_AUDIO",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.USE_BIOMETRIC",
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
          ]
          existing_perms = {
              el.get(attr("name")) for el in root.findall("uses-permission")
          }
          for p in permissions:
              if p not in existing_perms:
                  el = ET.Element("uses-permission")
                  el.set(attr("name"), p)
                  root.insert(0, el)

          provider_auth = "${applicationId}.taskifysounds"
          has_provider = any(
              p.get(attr("authorities")) == provider_auth
              for p in app.findall("provider")
          )
          if not has_provider:
              prov = ET.SubElement(app, "provider")
              prov.set(attr("name"), "androidx.core.content.FileProvider")
              prov.set(attr("authorities"), provider_auth)
              prov.set(attr("exported"), "false")
              prov.set(attr("grantUriPermissions"), "true")
              meta = ET.SubElement(prov, "meta-data")
              meta.set(attr("name"), "android.support.FILE_PROVIDER_PATHS")
              meta.set(attr("resource"), "@xml/taskify_sound_paths")

          receivers = [
              ("com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver", "false", None),
              ("com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver", "false", [
                  "android.intent.action.BOOT_COMPLETED",
                  "android.intent.action.MY_PACKAGE_REPLACED",
                  "android.intent.action.QUICKBOOT_POWERON",
                  "com.htc.intent.action.QUICKBOOT_POWERON",
              ]),
          ]
          existing_recv = {r.get(attr("name")) for r in app.findall("receiver")}
          for r_name, r_exp, actions in receivers:
              if r_name not in existing_recv:
                  rec = ET.SubElement(app, "receiver")
                  rec.set(attr("name"), r_name)
                  rec.set(attr("exported"), r_exp)
                  if actions:
                      inf = ET.SubElement(rec, "intent-filter")
                      for act in actions:
                          a = ET.SubElement(inf, "action")
                          a.set(attr("name"), act)

          widget_labels = [
              "01 Progress Ring", "02 Fire Streak", "03 Today 3 Tasks", "04 Next Up", "05 Focus 25m",
              "06 Study Today", "07 Weekly Score", "08 Monthly Score", "09 Category Stats", "10 Quick Add Pill",
              "11 AI Voice Orb", "12 Ask Offline AI", "13 Mood & Energy", "14 Mini Calendar", "15 Overdue Alert",
              "16 Spaced Revision", "17 Daily Briefing", "18 Habit Ring", "19 Daily Quote", "20 Streak Shield",
              "21 Mini Streak 1x1", "22 Mini % 1x1", "23 Mini Study 1x1", "24 Mini Due 1x1", "25 Wide Progress",
              "26 Wide Next Task", "27 Agenda 5 Tasks", "28 Study Hub 4x3", "29 Done vs Pending", "30 Deep Work",
              "31 Pomodoro 25/5", "32 Pomodoro 50/10", "33 Night Review", "34 Exam Target", "35 Priority Strip",
              "36 API AI Pill", "37 DeepSeek Pill", "38 Mega Glass 4x4", "39 Trophy Today", "40 Mood + Date Pill",
          ]
          existing_names = {r.get(attr("name")) for r in app.findall("receiver")}
          for idx, wlabel in enumerate(widget_labels, 1):
              cls_name = f"{os.environ['APP_PKG']}.TaskifyWidget{idx:02d}"
              if cls_name not in existing_names:
                  wrec = ET.SubElement(app, "receiver")
                  wrec.set(attr("name"), cls_name)
                  wrec.set(attr("label"), f"Taskify {wlabel}")
                  wrec.set(attr("exported"), "true")
                  winf = ET.SubElement(wrec, "intent-filter")
                  wact = ET.SubElement(winf, "action")
                  wact.set(attr("name"), "android.appwidget.action.APPWIDGET_UPDATE")
                  wmeta = ET.SubElement(wrec, "meta-data")
                  wmeta.set(attr("name"), "android.appwidget.provider")
                  wmeta.set(attr("resource"), f"@xml/tg_info_{idx:02d}")

          svc_name = f"{os.environ['APP_PKG']}.TaskifyVoiceService"
          has_svc = any(
              s.get(attr("name")) in (svc_name, ".TaskifyVoiceService")
              for s in app.findall("service")
          )
          if not has_svc:
              svc = ET.SubElement(app, "service")
              svc.set(attr("name"), ".TaskifyVoiceService")
              svc.set(attr("exported"), "false")
              svc.set(attr("foregroundServiceType"), "microphone|mediaPlayback")

          ET.indent(tree, space="    ")
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          ET.parse(manifest_path)
          print("AndroidManifest.xml validated successfully!")
          PYEOF

      - name: Install Dependencies & Clean
        run: |
          flutter clean
          flutter pub get

      # FIX: यह step पहले "flutter clean" से पहले था। चाहे flutter clean सामान्यतः
      # res/raw को न छुए, फिर भी notification sound crash (PlatformException:
      # invalid_sound / "resource sound_chime could not be found") से पूरी तरह बचने
      # के लिए अब raw sound files सबसे आख़िर में, clean होने के बाद, copy होती हैं —
      # ताकि कोई भी clean/regeneration step इन्हें कभी न हटा सके।
      - name: Notification receivers & custom sound files
        run: |
          mkdir -p android/app/src/main/res/raw
          if [ -d "assets/sounds" ]; then
            for f in assets/sounds/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f" | tr '[:upper:]' '[:lower:]' | tr '-' '_')
              cp "$f" "android/app/src/main/res/raw/$base"
            done
          fi

          mkdir -p android/app/src/main/res/layout android/app/src/main/res/drawable android/app/src/main/res/xml
          cp ci/res_widgets/layout/*.xml android/app/src/main/res/layout/
          cp ci/res_widgets/drawable/*.xml android/app/src/main/res/drawable/
          cp ci/res_widgets/xml/*.xml android/app/src/main/res/xml/
          cat << 'EOF' > android/app/src/main/res/xml/taskify_sound_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <files-path name="taskify_files" path="." />
              <cache-path name="taskify_cache" path="." />
              <external-files-path name="taskify_ext" path="." />
          </paths>
          EOF

      - name: Verify raw sound resources exist (fail fast instead of silent runtime crash)
        run: |
          python3 - << 'PYEOF'
          import os, re, sys
          RAW = "android/app/src/main/res/raw"
          ASSETS = "assets/sounds"
          expected = set()
          if os.path.isdir(ASSETS):
              for f in os.listdir(ASSETS):
                  stem = os.path.splitext(f)[0].lower()
                  key = re.sub(r"[^a-z0-9_]", "_", stem)
                  if key:
                      expected.add(key)
          present = {os.path.splitext(f)[0] for f in os.listdir(RAW)} if os.path.isdir(RAW) else set()
          missing = sorted(expected - present)
          if not present or missing:
              print(f"ERROR: ये raw sound resources नहीं मिले: {missing}")
              print(f"मौजूद फ़ाइलें: {sorted(present)}")
              sys.exit(1)
          print(f"OK: सभी raw sounds मौजूद हैं -> {sorted(present)}")
          PYEOF

      - name: Setup Icons
        run: |
          if [ -f "app_icon.png" ]; then
            dart run flutter_launcher_icons
          fi

      - name: Build Android APK
        run: flutter build apk --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taskify-apks
          path: build/app/outputs/flutter-apk/*.apk
