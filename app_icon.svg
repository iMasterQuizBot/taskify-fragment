<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#06080C"/>
    </linearGradient>

    <!-- Glowing Hero Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- To-Do Card Base Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2638"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>

    <!-- Card Glow Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Task Bar Gradients -->
    <linearGradient id="task1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="task2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="task3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Top Gloss Overlay -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Deep Drop Shadow -->
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Base (Squircle) -->
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="260" r="220" fill="#7C3AED" opacity="0.25" filter="blur(65px)"/>
  <circle cx="740" cy="760" r="240" fill="#0891B2" opacity="0.22" filter="blur(75px)"/>
  <circle cx="512" cy="512" r="180" fill="#F472B6" opacity="0.12" filter="blur(80px)"/>

  <!-- Outer Neon Habit Track (Circular Glow Ring) -->
  <circle cx="512" cy="512" r="350" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="20"/>
  <circle cx="512" cy="512" r="350" fill="none" stroke="url(#neonGrad)" stroke-width="22" stroke-linecap="round" stroke-dasharray="1300 900" transform="rotate(-65 512 512)" filter="url(#neonGlow)"/>

  <!-- ============================================================ -->
  <!-- CENTER COLORFUL TO-DO LIST RECTANGLE (FLOATING 3D GLASS CARD) -->
  <!-- ============================================================ -->
  <g filter="url(#cardShadow)">
    <!-- Main Card Body -->
    <rect x="232" y="212" width="560" height="600" rx="52" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

    <!-- Header Accent / Ribbon -->
    <path d="M232 264 Q232 212 284 212 L740 212 Q792 212 792 264 L792 290 L232 290 Z" fill="url(#neonGrad)" opacity="0.9"/>
    
    <!-- Floating Header Badge: "TO-DO LIST" -->
    <rect x="372" y="234" width="280" height="46" rx="23" fill="#0B0E14" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>
    <text x="512" y="264" fill="#22D3EE" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="3" text-anchor="middle">TO-DO LIST</text>

    <!-- Mini Progress Dots on Header -->
    <circle cx="310" cy="257" r="7" fill="#34D399" filter="url(#neonGlow)"/>
    <circle cx="714" cy="257" r="7" fill="#FBBF24"/>

    <!-- ================= TASK ROW 1 (COMPLETED - EMERALD GREEN) ================= -->
    <g transform="translate(282, 335)">
      <!-- Checkbox Circle (Checked) -->
      <circle cx="34" cy="34" r="28" fill="#34D399" filter="url(#neonGlow)"/>
      <path d="M22 34 L30 42 L46 24" fill="none" stroke="#0B0E14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Task Bar -->
      <rect x="84" y="16" width="310" height="20" rx="10" fill="url(#task1Grad)"/>
      <rect x="84" y="44" width="180" height="12" rx="6" fill="#34D399" opacity="0.45"/>
    </g>

    <!-- Divider 1 -->
    <line x1="282" y1="425" x2="742" y2="425" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

    <!-- ================= TASK ROW 2 (IN PROGRESS - CYAN BLUE) ================= -->
    <g transform="translate(282, 455)">
      <!-- Checkbox Circle (In Progress Glow Ring) -->
      <circle cx="34" cy="34" r="26" fill="#161B26" stroke="#22D3EE" stroke-width="5" filter="url(#neonGlow)"/>
      <circle cx="34" cy="34" r="12" fill="#22D3EE"/>
      
      <!-- Task Bar -->
      <rect x="84" y="16" width="340" height="20" rx="10" fill="url(#task2Grad)"/>
      <rect x="84" y="44" width="220" height="12" rx="6" fill="#22D3EE" opacity="0.45"/>
    </g>

    <!-- Divider 2 -->
    <line x1="282" y1="545" x2="742" y2="545" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

    <!-- ================= TASK ROW 3 (PENDING / PRIORITY - AMBER GOLD) ================= -->
    <g transform="translate(282, 575)">
      <!-- Checkbox Square / Circle (Pending) -->
      <circle cx="34" cy="34" r="26" fill="#161B26" stroke="#FBBF24" stroke-width="5"/>
      
      <!-- Task Bar -->
      <rect x="84" y="16" width="260" height="20" rx="10" fill="url(#task3Grad)"/>
      <rect x="84" y="44" width="150" height="12" rx="6" fill="#FBBF24" opacity="0.45"/>
    </g>

    <!-- Divider 3 -->
    <line x1="282" y1="665" x2="742" y2="665" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

    <!-- Bottom Action Pill: "3/3 COMPLETED TODAY" -->
    <g transform="translate(322, 700)">
      <rect x="0" y="0" width="380" height="48" rx="24" fill="url(#neonGrad)"/>
      <text x="190" y="31" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letterSpacing="1.5" text-anchor="middle">★ DAILY ROUTINE READY ★</text>
    </g>

    <!-- Diagonal Glass Sheen across the To-Do Card -->
    <path d="M236 264 L480 216 L310 808 L236 800 Z" fill="url(#glassGloss)" opacity="0.4"/>
  </g>

  <!-- Big Victory Checkmark Floating Overlay (Corner) -->
  <g filter="url(#neonGlow)">
    <circle cx="730" cy="740" r="64" fill="url(#neonGrad)"/>
    <path d="M702 742 L722 762 L762 718" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top App Glass Reflection -->
  <rect x="32" y="32" width="960" height="420" rx="240" fill="url(#glassGloss)"/>
</svg>
